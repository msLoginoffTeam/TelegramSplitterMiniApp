name: telegram-splitter-web

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # The API name resolves only inside the shared Docker network.
      API_UPSTREAM: http://splitter-api:8080
    ports:
      - '127.0.0.1:${WEB_PORT:-8080}:80'
    networks:
      - splitter-internal

networks:
  splitter-internal:
    external: true
    name: splitter-internal
